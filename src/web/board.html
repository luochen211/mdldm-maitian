const logo = (p) => { const l = LOGO[p]; return `<span class="lg${l.dark ? ' dark' : ''}" style="--bg:${l.bg}">${l.img ? `<img src="${l.img}" alt="">` : `<svg viewBox="0 0 24 24">${l.stroke ? `<path d="${l.stroke}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>` : `<path d="${l.d}" fill="#fff"/>`}</svg>`}</span>`; };
const FAN_WORD = { youtube: '订阅', zsz: '注册用户', channels: '关注者' };
const safeUrl = (u) => /^https?:\/\//.test(u || '') ? esc(u) : '';
const dayStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const daysBack = (n) => Array.from({ length: n }, (_, i) => dayStr(new Date(Date.now() - (n - 1 - i) * 864e5)));
if (new URLSearchParams(location.search).get('kiosk')) document.body.classList.add('kiosk');
let O = null, F = {};
const sum = (arr, k) => arr.reduce((s, r) => s + (r[k] || 0), 0);
const inter = (m) => m ? (m.likes || 0) + (m.comments || 0) + (m.favorites || 0) + (m.shares || 0) : 0;
const task = (e, p) => e && e.tasks.find(t => t.platform === p);
const M = (e, p) => (task(e, p) || {}).m || null;

// —— 粉丝 ——
const latest = (p) => { const d = Object.keys(F[p] || {}).sort(); return d.length ? F[p][d[d.length - 1]] : null; };
const gainN = (p, n) => { const t = dayStr(new Date()), b = dayStr(new Date(Date.now() - n * 864e5)); return F[p] && F[p][t] != null && F[p][b] != null ? F[p][t] - F[p][b] : null; };
const netOn = (p, d) => { const prev = dayStr(new Date(new Date(d + 'T12:00').getTime() - 864e5)); return F[p] && F[p][d] != null && F[p][prev] != null ? F[p][d] - F[p][prev] : null; };
const gp = (label, v) => v == null ? '' : `<span class="gpill">${label}<b class="${v < 0 ? 'neg' : ''}">${sgn(v)}</b></span>`;

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))); const m = v / p; return (m <= 1 ? 1 : m <= 1.5 ? 1.5 : m <= 2 ? 2 : m <= 3 ? 3 : m <= 4 ? 4 : m <= 5 ? 5 : m <= 7.5 ? 7.5 : 10) * p; }
// 每日净增：按平台堆叠的柱，发布日打标记
function drawFans(el, days, marks) {
  const w = el.clientWidth, h = el.clientHeight; if (w < 60 || h < 60) return;
  const L = 40, R = 6, T = 20, B = 20, n = days.length, pw = w - L - R, ph = h - T - B, band = pw / n, bw = Math.min(22, Math.max(3, band - 4));
  drawFans.lastLab = -1e9;
  const rows = days.map(d => ({ d, segs: FANP.map(p => ({ p, v: Math.max(0, netOn(p, d) || 0) })).filter(x => x.v > 0) }));
  rows.forEach(r => r.tot = r.segs.reduce((s, x) => s + x.v, 0));
  const top = niceMax(Math.max(...rows.map(r => r.tot), 1)), Y = (v) => T + ph - v / top * ph;
  let s = `<svg width="${w}" height="${h}"><defs>${FANP.map(p => `<linearGradient id="fg-${p}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--p-${p})"/><stop offset="1" stop-color="var(--p-${p})" stop-opacity=".55"/></linearGradient>`).join('')}</defs>`;
  for (const t of [0, top / 2, top]) s += `<line x1="${L}" x2="${w - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="rgba(0,0,0,.07)"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${t ? '+' : ''}${fmt(t)}</text>`;
  rows.forEach((r, i) => {
    const x = L + i * band + (band - bw) / 2; let acc = 0;
    r.segs.forEach((g, j) => { const y1 = Y(acc), y2 = Y(acc + g.v), hh = Math.max(1.5, y1 - y2 - (j < r.segs.length - 1 ? 2 : 0)); acc += g.v;
      s += `<rect class="bar" style="animation-delay:${i * 16}ms" x="${x.toFixed(1)}" y="${(y1 - (y1 - y2)).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="${j === r.segs.length - 1 ? Math.min(4, bw / 2) : 1.5}" fill="url(#fg-${g.p})"/>`; });
    let mk = marks[r.d]; const nx = rows[i + 1] && marks[rows[i + 1].d], pv = rows[i - 1] && marks[rows[i - 1].d];
    let lab = !mk || nx ? '' : pv ? pv + ' / ' + mk : mk;
    // 发布日一多标签会叠在一起：离上一个标签不到 130px 就只画虚线不写字（悬停仍能看到）
    const cx = x + bw / 2; if (lab && cx - (drawFans.lastLab ?? -1e9) < 130) lab = ''; else if (lab) { drawFans.lastLab = cx; if (lab.length > 14) lab = lab.slice(0, 13) + '…'; }
    if (mk) s += `<line x1="${(x + bw / 2).toFixed(1)}" x2="${(x + bw / 2).toFixed(1)}" y1="${T - 6}" y2="${T + ph}" stroke="#0071e3" stroke-opacity=".45" stroke-dasharray="3 3"/><text x="${(x + bw / 2).toFixed(1)}" y="${T - 9}" text-anchor="${i > n - 3 ? 'end' : 'middle'}" style="fill:var(--accent);font-weight:600">${esc(lab)}</text>`;
    if ((i % 5 === 0 && n - 1 - i > 4) || i === n - 1) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${h - 5}" text-anchor="${i === n - 1 ? 'end' : 'middle'}">${r.d.slice(5)}</text>`;
    s += `<rect x="${(L + i * band).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${ph}" fill="transparent" data-tip="${r.d.slice(5)}${mk ? '  ' + esc(mk) + ' 发布' : ''}\n${r.segs.length ? r.segs.map(g => PN[g.p] + '  +' + fmt(g.v)).join('\n') + '\n合计  +' + fmt(r.tot) : '没有记录'}"/>`;
  });
  el.innerHTML = s + '</svg>';
}
function sparkLine(p) {
  const d = daysBack(30).filter(x => F[p] && F[p][x] != null); if (d.length < 3) return '';
  const v = d.map(x => F[p][x]), lo = Math.min(...v), hi = Math.max(...v), W = 200, H = 40, X = (i) => i / (d.length - 1) * W, Y = (y) => H - 3 - (hi === lo ? .5 : (y - lo) / (hi - lo)) * (H - 8);
  const pts = v.map((y, i) => `${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-tip="${PN[p]} 近 ${d.length} 天\n${fmt(v[0])} → ${fmt(v[v.length - 1])}"><defs><linearGradient id="sl-${p}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--p-${p})" stop-opacity=".22"/><stop offset="1" stop-color="var(--p-${p})" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${H} ${pts} ${W},${H}" fill="url(#sl-${p})"/><polyline points="${pts}" fill="none" stroke="var(--p-${p})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

// —— 数据分析：按规则算出几句结论，算不出来的不写 ——
function insights(cur, ref) {
  const out = [], add = (k, tag, html) => out.push(`<div class="in"><em class="${k}">${tag}</em><div>${html}</div></div>`);
  // 1 涨粉主力
  const g7 = FANP.map(p => ({ p, v: gainN(p, 7) })).filter(x => x.v != null).sort((a, b) => b.v - a.v);
  if (g7.length) { const tot = g7.reduce((s, x) => s + x.v, 0); add('k3', '涨粉', `近 7 天涨粉最多的是<b>${PN[g7[0].p]} ${sgn(g7[0].v)}</b>${g7.length > 1 ? `，占 ${g7.map(x => PN[x.p]).join('、')} 合计 ${sgn(tot)} 的 <b>${pct(g7[0].v, tot)}</b>` : ''}。`); }
  // 2 发布日带来的涨粉
  if (ref && ref.schedule) {
    const d0 = ref.schedule.slice(0, 10), ps = FANP.filter(p => netOn(p, d0) != null), base = [];
    for (let i = 1; i <= 7; i++) { const d = dayStr(new Date(new Date(d0 + 'T12:00').getTime() - i * 864e5)); const v = ps.map(p => netOn(p, d)).filter(x => x != null); if (v.length === ps.length && ps.length) base.push(v.reduce((a, b) => a + b, 0)); }
    const on = ps.reduce((s, p) => s + netOn(p, d0), 0), avg = base.length ? base.reduce((a, b) => a + b, 0) / base.length : 0;
    if (ps.length && avg > 0) add('k3', '发布日', `「${esc(ref.nick)}」发布当天，${ps.map(p => PN[p]).join('、')}一共涨了 <b>${fmt(on)}</b> 粉，${on >= avg ? `是此前 7 天日均（${fmt(avg)}）的 <b>${(on / avg).toFixed(1)} 倍</b>` : `比此前 7 天日均（${fmt(avg)}）<b>少 ${((1 - on / avg) * 100).toFixed(0)}%</b>，这一期当天没有带来额外涨粉`}。`);
  }
  if (ref) {
    const rows = PL.map(p => ({ p, m: M(ref, p) })).filter(x => x.m && x.m.views >= 200).map(x => ({ ...x, r: inter(x.m) / x.m.views, f: (x.m.favorites || 0) / x.m.views }));
    // 3 播放集中度
    const top = [...rows].sort((a, b) => b.m.views - a.m.views)[0];
    if (top && ref.views) add('k2', '播放', `「${esc(ref.nick)}」<b>${pct(top.m.views, ref.views)}</b> 的播放来自<b>${PN[top.p]}</b>（${fmt(top.m.views)} / ${fmt(ref.views)}）。`);
    // 4 互动率
    const byR = [...rows].sort((a, b) => b.r - a.r);
    if (byR.length >= 2) { const a = byR[0], z = byR[byR.length - 1]; add('', '互动', `互动率最高的是<b>${PN[a.p]} ${(a.r * 100).toFixed(1)}%</b>，最低的是${PN[z.p]} ${(z.r * 100).toFixed(1)}%，相差 <b>${(a.r / Math.max(z.r, .0001)).toFixed(0)} 倍</b>。`); }
    // 5 收藏

    if (byF && byF.f > 0) add('', '收藏', `<b>${PN[byF.p]}</b>每 100 次播放有 <b>${(byF.f * 100).toFixed(1)}</b> 个收藏，是各平台里最把这期当干货存的。`);
  }
  // 6 渠道付费
  const ch = O.site.channels.filter(c => ['bilibili', 'douyin', 'xiaohongshu', 'twitter', 'youtube'].includes(c.source) && c.reg >= 50).map(c => ({ ...c, r: c.vip / c.reg })).sort((a, b) => b.r - a.r);
  if (ch.length >= 2) { const a = ch[0], z = ch[ch.length - 1]; add('k4', '转化', `知识站里，来自<b>${esc(a.label)}</b>的注册有 <b>${(a.r * 100).toFixed(1)}%</b> 成了会员；${esc(z.label)} 带来 ${fmt(z.reg)} 个注册，只有 ${(z.r * 100).toFixed(1)}%。`); }
  return out.slice(0, 6).join('') || '<div class="empty">数据还不够，过两天这里会有结论</div>';
}

function heroHTML(cur, prev) {
  const now = Date.now(), at = cur.schedule ? Date.parse(cur.schedule) : null;
  const pubN = cur.tasks.filter(t => t.state === 'published').length, sch = cur.tasks.filter(t => t.state === 'scheduled').length, todo = cur.tasks.filter(t => ['awaiting_user', 'filled'].includes(t.state)).length, bad = cur.tasks.filter(t => ['failed', 'not_logged_in'].includes(t.state)).length;
  const plan = cur.tasks.filter(t => t.state === 'planned').length;
  const st = bad ? `${bad} 个平台异常` : todo ? `${todo} 个平台等你点发布` : plan === cur.tasks.filter(t => t.state !== 'skipped').length ? `${plan} 个平台，还没开跑` : plan ? `${plan} 个平台还没开跑` : sch ? `${pubN} 已发布 · ${sch} 定时` : '全部已发布';
  const eb = plan && !pubN && !sch ? '分发计划' : bad || todo ? '发布中' : at && at > now ? '即将发布' : at && now - at < 48 * 3600e3 ? '刚发布' : '最新发布';
  const cmp = prev ? `<div class="cmp">上一期「${esc(prev.nick)}」目前 <b style="color:var(--t1)">${fmt(prev.views)}</b> 播放${cur.views > 1 ? `，这一期是它的 ${pct(cur.views, prev.views)}` : '，这一期发出后在这里对比'}<div class="tr"><i style="width:${Math.min(100, cur.views / Math.max(prev.views, 1) * 100).toFixed(1)}%"></i></div></div>` : '';
  const [t1, t2] = cur.name.split(/[｜|]/).map(x => x.trim()), k = cur.covers.includes('3x4') ? '3x4' : cur.covers[0], src = `/cover?id=${encodeURIComponent(cur.id)}&k=${k}`;
  const tabs = SL.length > 1 ? `<div class="ctabs">${SL.map((e, i) => { const d = e.schedule ? new Date(e.schedule) : null, dd = d ? Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 864e5) : null;
      const day = dd == null ? '' : dd === 0 ? '今天' : dd === 1 ? '明天' : dd === -1 ? '昨天' : `${d.getMonth() + 1}/${d.getDate()}`, done = e.tasks.every(t => t.state === 'published' || t.state === 'skipped'), warn = e.tasks.some(t => ['failed', 'not_logged_in', 'awaiting_user', 'filled'].includes(t.state));
      return `<button class="ct${i === HI ? ' on' : ''}" data-i="${i}" title="${esc(e.nick)}：${esc(e.name)}"><i class="${done ? 'ok' : warn ? 'warn' : 'wait'}"></i>${day} ${d ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : esc(e.nick)}${i === HI ? '<u></u>' : ''}</button>`; }).join('')}</div>` : '';
  return `${cur.covers.length ? `<div class="amb" style="background-image:url('${src}')"></div><div class="stage"><div class="float"><a class="cv" href="/p#/ep/${encodeURIComponent(cur.id)}"><i class="edge"></i><img src="${src}" alt=""><i class="glare"></i><span class="tagz a">第 ${esc(cur.episode)} 期</span><span class="tagz b"><i></i>${pubN}/${cur.tasks.length} 平台已发布</span></a></div></div>` : ''}
      <div class="inf">${tabs}<div class="eyebrow">${eb}</div><h2>${esc(t1)}</h2>${t2 ? `<div class="subt">${esc(t2)}</div>` : ''}<div class="when"><span id="cd"></span><span style="color:var(--t3)">· ${esc(st)}</span></div>
        <div class="plats">${PL.map(p => task(cur, p)).filter(Boolean).map(t => { const u = safeUrl(t.url), on = t.state === 'published', cls = on ? 'on' : ['awaiting_user', 'filled'].includes(t.state) ? 'todo' : ['failed', 'not_logged_in'].includes(t.state) ? 'bad' : ''; return `<${u ? `a href="${u}" target="_blank" rel="noopener"` : 'div'} class="pl ${cls}" data-tip="${PN[t.platform]}  ${esc(t.stateCn)}${t.detail ? '\n' + esc(t.detail) : ''}">${logo(t.platform)}<div><b>${PN[t.platform]}</b><span>${on ? (t.m ? (SL.length > 1 ? kfmt(t.m.views) : fmt(t.m.views) + ' 播放') : '已发布') : esc(t.stateCn)}</span></div></${u ? 'a' : 'div'}>`; }).join('')}</div>
        <div class="nums"><div><div class="lab">全平台播放</div><div class="val">${cur.views > 1 ? fmt(cur.views) : '–'}</div></div><div><div class="lab">互动（赞评藏转）</div><div class="val">${cur.views > 1 ? fmt(cur.inter) : '–'}</div></div><div><div class="lab">互动率</div><div class="val">${cur.views > 1 ? pct(cur.inter, cur.views, 1) : '–'}</div></div></div>${cmp}</div>`;
}
let SL = [], HI = null, HID = null, HT = null;
// 切到第 i 张：只换大卡，不动其他面板
function show(i, user) {

}
let PAUSE = 0, PREVOF = null;

document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('.ct'); if (b) { e.preventDefault(); show(+b.dataset.i, true); } });

function render() {

  const fansTotal = FANP.reduce((s, p) => s + (latest(p) || 0), 0);
  const g1 = FANP.map(p => gainN(p, 1)).filter(v => v != null), g7 = FANP.map(p => gainN(p, 7)).filter(v => v != null), g30 = FANP.map(p => gainN(p, 30)).filter(v => v != null);

    const sp = sparkLine(p);
    return `<div class="panel pc" style="--c:var(--p-${p})"><div class="nm">${logo(p)}${PN[p]}<small>${FAN_WORD[p] || '粉丝'}</small></div>
      <div class="val">${kfmt(tot)}</div><div class="gl">${gp('今日', a)}${gp('7 天', b)}${a == null && b == null ? '<span class="gpill">今天开始记录</span>' : ''}</div>
      <div class="sp">${sp}</div>
      <div class="ft"><div><span title="${cur ? esc(cur.name) : ''}">${cur ? esc(cur.nick) : '本期'}</span><b>${on && mc ? fmt(mc.views) : tc ? esc(tc.stateCn) : '–'}</b></div><div>${prev || ref ? `<span title="${esc((prev || ref).name)}">${esc((prev || ref).nick)}</span>` : '上期'}<b>${mr ? fmt(mr.views) : '–'}${mr && mr.views >= 50 ? `<span style="display:block;font-weight:400;font-size:11.5px;color:var(--t3)">互动率 ${pct(inter(mr), mr.views, 1)}</span>` : ''}</b></div></div></div>`;
  };
  const f0 = O.feed[0];
  $('#screen').innerHTML = `
  <div class="top"><div class="logo">麦<i>田</i></div><div class="tag">内容与粉丝监控</div>
    <div class="nav"><a class="on" href="/">大屏</a><a href="/p#/traffic">流量</a><a href="/p#/calendar">日历</a><a href="/p#/convert">转化</a><a href="/p#/archive">档案</a><a href="/p#/system">系统</a></div>
    <div class="lights"><span class="light ok">守护进程 运行中</span><span class="light ${h.nas ? 'ok' : 'bad'}">NAS ${h.nas ? '已挂载' : '读不到'}</span><span class="light ${h.chrome ? 'ok' : 'bad'}">专用浏览器 ${h.chrome ? '在线' : '没开'}</span>
      <span class="light ${!loginOk ? 'bad' : checked ? 'ok' : 'warn'}">平台登录 ${!loginOk ? '有掉线' : checked ? '今日已检' : '今天还没检'}</span></div>

      <div class="ph" style="margin:10px 0 2px"><h3 style="font-size:12.5px;color:var(--t2);font-weight:500">每日净增 · 近 30 天</h3><span class="note">${FANP.filter(p => gainN(p, 2) != null).map(p => `<i class="sw" style="width:8px;height:8px;margin:0 5px 0 10px;background:var(--p-${p})"></i>${PN[p]}`).join('')}</span></div>

      <div class="cap">${noHist.length ? `${noHist.map(p => PN[p]).join('、')}后台不给历史，从今天开始记；涨跌只统计${cover7.map(p => PN[p]).join('、') || '有历史的平台'}` : '全部平台都有记录'}</div></div>
    <div class="panel"><div class="ph"><h3>数据分析</h3><span class="note">按规则自动算，每天更新</span></div><div class="pb ins">${insights(cur, ref)}</div></div>
  </div>

  <div class="cards" style="--n:${PL.length}">${PL.map(card).join('')}</div>

  ${O.siteOn ? `  <a class="panel strip" href="/p#/convert"><h3>${esc(PN.zsz)} · 近 7 天</h3><span>新注册<b>${fmt(sum(l7, 'reg'))}</b></span><span>新会员<b>${fmt(sum(l7, 'vip'))}</b></span><span>订单<b>${fmt(sum(l7, 'orders'))}</b></span><span>收入<b>¥${fmt(sum(l7, 'revenue'))}</b></span>
    <span class="feedline">${f0 ? `最近动态：${pad(new Date(f0.ts).getHours())}:${pad(new Date(f0.ts).getMinutes())} ${f0.nick ? '「' + esc(f0.nick) + '」' : ''}${esc(f0.platform)} ${esc(f0.action)}${f0.result ? ' · ' + esc(f0.result) : ''}` : ''}</span><span class="go">转化详情 ›</span></a>` : ''}`;
  draw(); tick(); fixTabs(); if (!render.done) { render.done = true; countUp(); }
}
function draw() { if (!O) return; const ins = document.querySelector('.ins'); if (ins && innerWidth > 1100) { [...ins.children].forEach(c => c.style.display = ''); for (let k = ins.children.length - 1; k > 0 && ins.scrollHeight > ins.clientHeight + 2; k--) ins.children[k].style.display = 'none'; } const el = $('#c-fans'); if (!el) return; drawFans(el, daysBack(30), Object.fromEntries(O.episodes.filter(e => e.schedule).map(e => [e.schedule.slice(0, 10), e.nick]))); }
function countUp() {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  document.querySelectorAll('.val').forEach(el => {
    const m = el.textContent.match(/^(\D*)([\d,]+)(\D*)$/); if (!m) return; const to = +m[2].replace(/,/g, ''), t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - k, 4); el.textContent = m[1] + Math.round(to * e).toLocaleString('en-US') + m[3]; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function tick() {
  const n = new Date(), c = $('#clock'); if (!c) return;
  c.innerHTML = `<small>${n.getMonth() + 1}/${n.getDate()} 周${'日一二三四五六'[n.getDay()]}</small>${pad(n.getHours())}:${pad(n.getMinutes())}`;
  const cd = $('#cd'), cur = O && (SL[HI] || O.episodes[0]);
  if (cd && cur) {
    const s = cur.schedule ? Math.round((new Date(cur.schedule) - n) / 1000) : null, d = cur.schedule && new Date(cur.schedule), at = d ? `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
    cd.textContent = s == null ? '' : s > 0 ? (s > 86400 ? `定时 ${at}，还有 ${Math.floor(s / 86400)} 天 ${Math.floor(s % 86400 / 3600)} 小时` : `定时 ${at}，还有 ${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`) : -s < 3600 ? `${at} 发布，已发 ${Math.floor(-s / 60)} 分钟` : -s < 172800 ? `${at} 发布，已发 ${Math.floor(-s / 3600)} 小时` : `${at} 发布，已发 ${Math.floor(-s / 86400)} 天`;
  }
}
async function load() {
  try { const r = await fetch('/api/overview'); if (!r.ok) throw new Error(r.status); O = await r.json(); if (O.platforms) { PL = PL.filter(p => p === 'zsz' || O.platforms.includes(p)); FANP = FANP.filter(p => O.platforms.includes(p)); } if (!O.siteOn) PL = PL.filter(p => p !== 'zsz'); else { if (O.siteName) PN.zsz = O.siteName; if (O.siteLogo) LOGO.zsz = { img: '/site-logo' }; } render(); }
  catch (e) { if (!O) $('#screen').innerHTML = `<div class="empty">连不上麦田服务（${esc(e.message)}）</div>`; else console.error(e); }
}
const tip = $('#tip');
document.addEventListener('mousemove', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.style.display = 'none'; return; } tip.textContent = t.dataset.tip; tip.style.display = 'block'; const w = tip.offsetWidth; tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px'; tip.style.top = Math.max(8, e.clientY - 34) + 'px'; });
addEventListener('resize', draw);
if (matchMedia('(hover:hover)').matches) {
  let last = null;
  document.addEventListener('mousemove', (e) => {
    const hr = e.target.closest && e.target.closest('.hero');
    if (hr) { const r = hr.getBoundingClientRect(), cv = hr.querySelector('.cv'); if (cv) { cv.style.setProperty('--hy', (((e.clientX - r.left) / r.width - .5) * 22).toFixed(2) + 'deg'); cv.style.setProperty('--hx', ((.5 - (e.clientY - r.top) / r.height) * 14).toFixed(2) + 'deg'); } }
    else { const cv = document.querySelector('.hero .cv'); if (cv) { cv.style.setProperty('--hy', '0deg'); cv.style.setProperty('--hx', '0deg'); } }
    const el = e.target.closest && e.target.closest('.panel:not(.hero),.node');
